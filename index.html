<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Le cartable de Harry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: une colonne calme (max 760px), onglets en haut, cartes seulement pour ce qui se coche ou se révise. Grille Seyès discrète en clin d'œil au cahier. */
:root {
  --bg: #f6f7fb;
  --paper: #ffffff;
  --ink: #1c2140;
  --muted: #646b8c;
  --line: #e3e6f0;
  --seyes: #dfe6ff;
  --accent: #2448d8;
  --accent-ink: #ffffff;
  --marker: #ffe066;
  --good: #1f9d63;
  --good-soft: #e3f6ec;
  --bad: #d6453d;
  --bad-soft: #fde9e7;
  --warn: #c77d00;
  --shadow: 0 1px 2px rgba(28,33,64,.06), 0 4px 14px rgba(28,33,64,.05);
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12152a; --paper: #1b1f3a; --ink: #eef0fb; --muted: #a2a8c8; --line: #2c3156; --seyes: #262c55;
  --accent: #7d97ff; --accent-ink: #0f1430; --marker: #f2cf3a; --good: #4fd193; --good-soft: #173a2c;
  --bad: #ff7d74; --bad-soft: #3d1e22; --warn: #f3b443; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12152a; --paper: #1b1f3a; --ink: #eef0fb; --muted: #a2a8c8; --line: #2c3156; --seyes: #262c55;
  --accent: #7d97ff; --accent-ink: #0f1430; --marker: #f2cf3a; --good: #4fd193; --good-soft: #173a2c;
  --bad: #ff7d74; --bad-soft: #3d1e22; --warn: #f3b443; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 60px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.mark { background: linear-gradient(transparent 55%, var(--marker) 55%); padding: 0 .1em; }
.num { font-variant-numeric: tabular-nums; }

header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
header.top .date { font-size: .95rem; color: var(--muted); }
.iconbtn { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .9rem; cursor: pointer; }

nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px; scrollbar-width: none; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-top: 6px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; border: 0; background: transparent; color: var(--muted); font: 700 .95rem var(--f-display); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
nav.tabs .count { display: inline-block; min-width: 1.4em; margin-left: 4px; padding: 0 5px; border-radius: 999px; background: var(--marker); color: #1c2140; font-size: .75rem; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

section.view { display: grid; gap: 18px; }
.card { background: var(--paper); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.seyes { background-color: var(--paper); background-image: linear-gradient(var(--seyes) 1px, transparent 1px); background-size: 100% 26px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: .85rem; font-weight: 700; background: color-mix(in srgb, var(--c) 16%, var(--paper)); color: color-mix(in srgb, var(--c) 70%, var(--ink)); white-space: nowrap; }
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .78rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
.pill.ctrl { background: var(--bad-soft); color: var(--bad); }
.pill.now { background: var(--marker); color: #1c2140; }
.pill.ok { background: var(--good-soft); color: var(--good); }

button.btn { border: 0; border-radius: 12px; padding: 10px 16px; font: 700 .95rem var(--f-body); cursor: pointer; background: var(--accent); color: var(--accent-ink); }
button.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid color-mix(in srgb, var(--accent) 40%, transparent); }
button.btn.soft { background: color-mix(in srgb, var(--accent) 12%, var(--paper)); color: var(--accent); }
button.btn.good { background: var(--good); color: #fff; }
button.btn:disabled { opacity: .5; cursor: default; }
button.link { border: 0; background: none; color: var(--muted); font: inherit; font-size: .85rem; cursor: pointer; padding: 2px 4px; text-decoration: underline; text-underline-offset: 2px; }
button.link.danger { color: var(--bad); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
textarea { width: 100%; resize: vertical; }
label.f { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 700; flex: 1 1 140px; min-width: 0; }
label.f > * { font-weight: 400; color: var(--ink); width: 100%; }
details > summary { cursor: pointer; font-weight: 700; color: var(--accent); list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; }
details[open] > summary::before { content: "– "; }

/* Check rows */
.check { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; padding: 6px 0; }
.check input[type=checkbox] { appearance: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); background: var(--paper); cursor: pointer; display: grid; place-items: center; margin: 0; padding: 0; }
.check input[type=checkbox]:checked { background: var(--good); border-color: var(--good); }
.check input[type=checkbox]:checked::after { content: ""; width: 7px; height: 13px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px,-1px); }
.check.done .txt { color: var(--muted); text-decoration: line-through; }
.check .txt { min-width: 0; }

/* Moments */
.moment { border-left: 0; position: relative; }
.moment.active { outline: 2.5px solid var(--marker); }
.moment .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.progress { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--good); border-radius: 999px; transition: width .3s; }

/* Emploi du temps */
.edt { overflow-x: auto; }
.edt table { border-collapse: separate; border-spacing: 6px; width: 100%; min-width: 560px; }
.edt th { font: 700 .9rem var(--f-display); color: var(--muted); text-align: left; padding: 2px 4px; }
.edt th.today { color: var(--ink); }
.edt td { vertical-align: top; padding: 0; width: 20%; }
.cours { border-radius: 10px; padding: 7px 9px; background: color-mix(in srgb, var(--c) 15%, var(--paper)); border-left: 4px solid var(--c); margin-bottom: 6px; font-size: .88rem; line-height: 1.3; }
.cours b { display: block; }
.cours .h { color: var(--muted); font-size: .78rem; }
.daylist { display: grid; gap: 6px; }
.daylist .cours { display: grid; grid-template-columns: 92px 1fr; gap: 8px; margin: 0; }

/* Notes */
.big { font: 800 2.6rem/1 var(--f-display); }
.subj { display: grid; gap: 6px; padding: 12px; border-radius: 12px; background: color-mix(in srgb, var(--c) 9%, var(--paper)); }
.trend-up { color: var(--good); } .trend-down { color: var(--bad); }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--f-body); }
.legend { display: flex; gap: 6px; flex-wrap: wrap; }
.legend button { border: 0; cursor: pointer; font: inherit; }
.legend button[aria-pressed="false"] { opacity: .4; }
.notes-list { display: grid; gap: 4px; }
.notes-list .r { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }

/* Stars */
.stars { display: inline-flex; gap: 2px; }
.stars button { border: 0; background: none; cursor: pointer; font-size: 1.25rem; line-height: 1; padding: 2px; color: var(--line); }
.stars button.on { color: var(--warn); }

/* Erreurs */
.err { display: grid; gap: 6px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); }
.err .wrong { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 2px; }
.err .right { color: var(--good); font-weight: 700; }
.err.seen { opacity: .6; }
.streak { font: 800 1.6rem var(--f-display); }


.score { font: 800 2rem var(--f-display); }
.qcm { display: grid; gap: 6px; }
.qcm button.opt { text-align: left; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 10px; padding: 9px 12px; font: inherit; cursor: pointer; }
.qcm button.opt.right { border-color: var(--good); background: var(--good-soft); }
.qcm button.opt.wrongpick { border-color: var(--bad); background: var(--bad-soft); }

.empty { text-align: center; padding: 26px 12px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty .doodle { font: 800 2.2rem var(--f-display); color: var(--accent); opacity: .8; }

dialog { border: 0; border-radius: 18px; padding: 0; background: var(--paper); color: var(--ink); width: min(560px, calc(100vw - 32px)); max-height: 88vh; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(18,21,42,.45); }
dialog .in { padding: 18px; display: grid; gap: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 20; max-width: calc(100vw - 32px); }
.status { font-size: .82rem; color: var(--muted); }

@media (max-width: 480px) { h1 { font-size: 1.55rem; } .big { font-size: 2.1rem; } .daylist .cours { grid-template-columns: 78px 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Le cartable de Harry</h1>
      <p class="date" id="today-label"></p>
    </div>
    <div class="row">
      <span class="status" id="sync"></span>
      <button class="iconbtn" id="btn-settings" type="button">Réglages</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>

<dialog id="dlg"><div class="in" id="dlg-in"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseIso = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const longDate = d => JOURS[d.getDay()] + " " + d.getDate() + " " + MOIS[d.getMonth()];
const shortDate = s => { const d = parseIso(s); return d.getDate() + " " + MOIS[d.getMonth()].slice(0, 4).replace(/\.$/, "") + "."; };
const nextSchoolDay = d => { let x = addDays(d, 1); while (x.getDay() === 0 || x.getDay() === 6) x = addDays(x, 1); return x; };
const isSchoolDay = d => d.getDay() >= 1 && d.getDay() <= 5;
const toMin = t => { const [h, m] = String(t || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
const fmt20 = v => (Math.round(v * 10) / 10).toString().replace(".", ",");

/* Couleurs des matières */
const PALETTE = ["#2f6df6","#1f9d63","#e0457b","#f08a24","#8a56e2","#12a3a8","#c9a100","#d6453d","#5b7085"];
const KNOWN = [
  [/fran/i, 0], [/math/i, 3], [/hist|géo|geo/i, 6], [/angl/i, 2], [/svt|vie|terre/i, 1],
  [/phys|chim|scien/i, 5], [/techno/i, 8], [/eps|sport/i, 7], [/art/i, 4], [/musi|éduc.*mus/i, 4],
  [/emc|morale|civi/i, 6], [/espa|allem|latin|ital/i, 2]
];
const colorOf = m => {
  for (const [re, i] of KNOWN) if (re.test(m || "")) return PALETTE[i];
  let h = 0; for (const c of String(m || "")) h = (h * 31 + c.charCodeAt(0)) | 0;
  return PALETTE[Math.abs(h) % PALETTE.length];
};
const chip = m => `<span class="chip" style="--c:${colorOf(m)}">${esc(m || "Autre")}</span>`;

/* Données */
const S = { edt: [], devoirs: [], notes: [], vu: [], erreurs: [], cfg: {} };
const COLS = ["edt", "devoirs", "notes", "vu", "erreurs"];
let db = null, sample = null, canSendImages = false, ready = false;
const local = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); };

async function add(col, data) {
  if (!db) return toast("La sauvegarde n'est pas disponible ici.");
  try { await db.collection(col).add({ ...data, cree: new Date().toISOString() }); }
  catch (e) { toast(e?.code === "quota_exceeded" ? "Le cartable est plein : supprime de vieux éléments." : "Pas enregistré, réessaie."); }
}
async function upd(col, id, data) { if (!db) return; try { await db.collection(col).doc(id).update(data); } catch { toast("Pas enregistré, réessaie."); } }
async function del(col, id) { if (!db) return; try { await db.collection(col).doc(id).delete(); } catch { toast("Pas supprimé, réessaie."); } }

/* Calculs */
const now = () => new Date();
function weekType(d) {
  const ref = S.cfg.semaineA; if (!ref) return "";
  const monday = x => { const y = new Date(x); y.setHours(0,0,0,0); y.setDate(y.getDate() - ((y.getDay() + 6) % 7)); return y; };
  const w = Math.round((monday(d) - monday(parseIso(ref))) / (7 * 864e5));
  return Math.abs(w) % 2 === 0 ? "A" : "B";
}
function coursDu(d) {
  const wt = weekType(d), j = d.getDay();
  return S.edt.filter(c => Number(c.jour) === j && (!c.semaine || !wt || c.semaine === wt)).sort((a, b) => toMin(a.debut) - toMin(b.debut));
}
const matieresDu = d => [...new Set(coursDu(d).map(c => c.matiere))];
const devoirsPour = d => S.devoirs.filter(x => x.pour === iso(d));
const erreursARevoir = () => { const t = iso(now()); return S.erreurs.filter(e => !e.maitrise && !(e.revues || []).includes(t)); };
function streak() {
  const days = new Set(S.erreurs.flatMap(e => e.revues || []));
  let n = 0, d = now();
  if (!days.has(iso(d))) d = addDays(d, -1);
  while (days.has(iso(d))) { n++; d = addDays(d, -1); }
  return n;
}
function moyennes() {
  const by = {};
  for (const n of S.notes) {
    const v = Number(n.note) / (Number(n.sur) || 20) * 20, c = Number(n.coef) || 1;
    if (!isFinite(v)) continue;
    (by[n.matiere] ??= { s: 0, c: 0, list: [] });
    by[n.matiere].s += v * c; by[n.matiere].c += c; by[n.matiere].list.push({ ...n, v });
  }
  for (const k in by) { by[k].moy = by[k].s / by[k].c; by[k].list.sort((a, b) => String(a.date).localeCompare(String(b.date))); }
  const ks = Object.keys(by);
  const gen = ks.length ? ks.reduce((a, k) => a + by[k].moy, 0) / ks.length : null;
  return { by, gen };
}

/* Onglets */
const TABS = [
  ["jour", "Aujourd'hui"], ["semaine", "Emploi du temps"], ["devoirs", "Devoirs"], ["notes", "Notes"],
  ["vu", "Vu en classe"], ["erreurs", "Cahier d'erreurs"], ["entrainement", "S'entraîner"]
];
let tab = TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : local.get("tab", "jour");
function renderTabs() {
  const counts = {
    devoirs: S.devoirs.filter(d => !d.fait && d.pour >= iso(now())).length,
    erreurs: erreursARevoir().length
  };
  $("#tabs").innerHTML = TABS.map(([k, l]) =>
    `<button role="tab" type="button" data-tab="${k}" aria-selected="${tab === k}">${l}${counts[k] ? `<span class="count num">${counts[k]}</span>` : ""}</button>`).join("");
}
function render() {
  renderTabs();
  $("#today-label").textContent = longDate(now()).replace(/^./, c => c.toUpperCase()) + (weekType(now()) ? " · semaine " + weekType(now()) : "");
  const v = { jour: vJour, semaine: vSemaine, devoirs: vDevoirs, notes: vNotes, vu: vVu, erreurs: vErreurs, entrainement: vEntrainement }[tab];
  const keep = tab === "entrainement" && $("#view section[data-v='entrainement']");
  if (!keep) $("#view").innerHTML = `<section class="view" data-v="${tab}">${v()}</section>`;
  else refreshTrainingPicker();
  if (tab === "notes") drawChart();
}

/* ---------- Aujourd'hui ---------- */
function routineState() { return local.get("routine-" + iso(now()), {}); }
function checkRow(id, html, st) {
  const done = !!st[id];
  return `<label class="check ${done ? "done" : ""}"><input type="checkbox" data-routine="${id}" ${done ? "checked" : ""}><span class="txt">${html}</span></label>`;
}
function momentCard(key, title, when, items, active) {
  const st = routineState(), done = items.filter(i => st[i.id]).length;
  return `<div class="card moment ${active ? "active" : ""} ${key === "coucher" ? "seyes" : ""}">
    <div class="head"><h2>${title}</h2>${active ? `<span class="pill now">C'est le moment</span>` : `<span class="muted small">${when}</span>`}</div>
    <div class="progress" aria-label="${done} sur ${items.length}"><i style="width:${items.length ? done / items.length * 100 : 0}%"></i></div>
    <div>${items.map(i => checkRow(i.id, i.html, st)).join("")}</div>
  </div>`;
}
function vJour() {
  const d = now(), demain = nextSchoolDay(d), mDemain = matieresDu(demain);
  const retour = S.cfg.retour || "17:00", coucher = S.cfg.coucher || "21:00";
  const m = d.getHours() * 60 + d.getMinutes();
  const moment = m < toMin(retour) ? "ecole" : m < toMin(coucher) - 60 ? "retour" : "coucher";
  const dv = devoirsPour(demain), dvRest = dv.filter(x => !x.fait);
  const vuAuj = S.vu.filter(v => v.date === iso(d));
  const er = erreursARevoir();
  const nomDemain = isSchoolDay(addDays(d, 1)) ? "demain" : JOURS[demain.getDay()];

  const listDv = dv.length ? `<ul class="small" style="margin:4px 0 0;padding-left:18px">${dv.map(x => `<li>${esc(x.matiere)} : ${esc(x.texte)}${x.type === "controle" ? ` <span class="pill ctrl">contrôle</span>` : ""}</li>`).join("")}</ul>` : "";
  const retourItems = [
    { id: "r-pause", html: "Goûter et petite pause de 15 minutes" },

function drawChart() {
  const el = $("#chart"); if (!el) return;
  const { by } = moyennes();
  const ks = Object.keys(by).filter(k => !hidden.has(k));
  const all = ks.flatMap(k => by[k].list);
  if (!all.length) { el.innerHTML = `<p class="muted small">Choisis une matière ci-dessous.</p>`; return; }
  const dates = all.map(n => parseIso(n.date).getTime());
  let t0 = Math.min(...dates), t1 = Math.max(...dates); if (t1 === t0) { t0 -= 864e5 * 3; t1 += 864e5 * 3; }
  const W = 640, H = 240, L = 30, R = 14, T = 12, B = 26;
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R), y = v => T + (1 - v / 20) * (H - T - B);
  let g = "";
  for (const v of [0, 5, 10, 15, 20]) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" stroke-opacity="${v === 10 ? .25 : .1}" ${v === 10 ? 'stroke-dasharray="4 4"' : ""}/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const months = []; let d = new Date(t0); d = new Date(d.getFullYear(), d.getMonth(), 1);
  while (d.getTime() <= t1) { if (d.getTime() >= t0) months.push(d.getTime()); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
  if (!months.length) months.push(t0);
  for (const m of months) { const dd = new Date(m); g += `<text x="${x(m)}" y="${H - 6}" text-anchor="middle">${dd.getDate() === 1 ? MOIS[dd.getMonth()].slice(0, 4) : shortDate(iso(dd))}</text>`; }
  for (const k of ks) {
    const c = colorOf(k), pts = by[k].list.map(n => [x(parseIso(n.date).getTime()), y(n.v), n]);
    if (pts.length > 1) g += `<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}"/>`;
    for (const [px, py, n] of pts) g += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4.5" fill="${c}" stroke="var(--paper)" stroke-width="2"><title>${esc(k)} : ${esc(n.note)}/${esc(n.sur)} (${esc(shortDate(n.date))})</title></circle>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de mes notes sur 20" style="color:var(--muted)">${g}</svg>`;
}

/* Petite couche qui imite l'ancienne base (collection / doc / onSnapshot) au-dessus de la table Supabase "items". */
function makeDb(sb, uid) {
  const rows = {}, colFns = {}, docFns = {};
  const snapOf = r => ({ id: r?.id, exists: !!r, data: () => r ? { ...r.data } : undefined, metadata: { fromCache: false } });
  function emit(col) {
    const list = rows[col] || [];
    for (const fn of colFns[col] || []) fn({ docs: list.map(snapOf), size: list.length, empty: !list.length, metadata: { fromCache: false } });
    for (const key in docFns) if (key.startsWith(col + "/")) { const id = key.slice(col.length + 1); for (const fn of docFns[key]) fn(snapOf(list.find(r => r.id === id))); }
  }
  async function load(col) {
    const { data, error } = await sb.from("items").select("id,data").eq("collection", col);
    if (error) throw error;
    rows[col] = data; emit(col);
  }
  const fail = e => { console.error(e); throw { code: "unavailable", message: String(e?.message || e) }; };
  sb.channel("items-" + uid)
    .on("postgres_changes", { event: "*", schema: "public", table: "items" }, p => { const col = p.new?.collection || p.old?.collection; if (col) load(col).catch(() => {}); })
    .subscribe();
  function docRef(col, id) {
    return {
      id,
      async set(data) { const { error } = await sb.from("items").upsert({ user_id: uid, collection: col, id, data }); if (error) fail(error); await load(col); },
      async update(patch) {
        const cur = (rows[col] || []).find(r => r.id === id)?.data || {};
        const { error } = await sb.from("items").update({ data: { ...cur, ...patch } }).eq("collection", col).eq("id", id);
        if (error) fail(error); await load(col);
      },
      async delete() { const { error } = await sb.from("items").delete().eq("collection", col).eq("id", id); if (error) fail(error); await load(col); },
      onSnapshot(next, err) { const key = col + "/" + id; (docFns[key] ??= []).push(next); load(col).catch(e => err?.(e)); return () => {}; }
    };
  }
  return {
    collection(col) {
      return {
        async add(data) { const ref = docRef(col, crypto.randomUUID?.() ?? Date.now().toString(36) + Math.random().toString(36).slice(2)); await ref.set(data); return ref; },
        doc: id => docRef(col, id),
        onSnapshot(next, err) { (colFns[col] ??= []).push(next); load(col).catch(e => err?.(e)); return () => {}; }
      };
    },
    doc(path) { const [col, id] = path.split("/"); return docRef(col, id); }
  };
}

/* Remplace l'ancien Claude intégré : la page appelle /api/claude (fonction Vercel). */
function makeSample(sb) {
  const shrink = file => new Promise((ok, ko) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      ok(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
    };
    img.onerror = () => ko({ code: "image_rejected" });
    img.src = URL.createObjectURL(file);
  });
  async function call(prompt, opts = {}) {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw { code: "not_granted" };
    const images = opts.images ? await Promise.all([...(opts.images.length != null ? opts.images : [opts.images])].map(shrink)) : [];
    let r;
    try {
      r = await fetch("/api/claude", { method: "POST", signal: opts.signal, headers: { "content-type": "application/json", authorization: "Bearer " + session.access_token }, body: JSON.stringify({ prompt: String(prompt), images }) });
    } catch (e) { throw { code: e?.name === "AbortError" ? "cancelled" : "upstream_error" }; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: j.code || "upstream_error", message: j.message };
    return j.text;
  }
  const parse = text => {
    const tries = [text, (text.match(/```(?:json)?\s*([\s\S]*?)```/) || [])[1], text.slice(Math.min(...["{", "["].map(c => text.indexOf(c)).filter(i => i >= 0)), Math.max(text.lastIndexOf("}"), text.lastIndexOf("]")) + 1)];
    for (const t of tries) { try { if (t) return JSON.parse(t); } catch {} }
    throw { code: "invalid_json", text };
  };
  const sample = async (input, opts = {}) => { const text = await call(input, opts); opts.onText?.({ text, delta: text }); return { text, truncated: false }; };
  sample.json = async (input, opts = {}) => parse(await call(input, opts));
  sample.limits = async () => ({ images: { maxCount: 1 } });
  return sample;
}

  $("#btn-settings").hidden = true;
  $("#tabs").innerHTML = "";
  $("#view").innerHTML = `<section class="view"><div class="card seyes">
    <h2>Bonjour Harry</h2>
    <p>Tape ton code secret. Tu n'auras à le faire qu'une fois sur cet appareil.</p>
    <form id="login" class="row">
      <label class="f" style="flex:3 1 240px">Code secret<input id="login-code" type="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Ouvrir mon cartable</button>
    </form>
    <p class="status" id="login-status"></p>
  </div></section>`;
  $("#login").addEventListener("submit", async e => {
    e.preventDefault(); e.stopPropagation();
    const st = $("#login-status"); st.textContent = "Ouverture…";
    if (!appEmail) { st.textContent = "Il manque APP_EMAIL sur Vercel (voir LISEZ-MOI)."; return; }
    const { error } = await sb.auth.signInWithPassword({ email: appEmail, password: $("#login-code").value });
    if (!error) return;
    const m = String(error.message || "");
    st.textContent = /invalid login credentials/i.test(m) ? "Ce n'est pas le bon code. Réessaie, ou demande-le à ton parent."
      : error.status === 429 ? "Trop d'essais : attends quelques minutes."
      : /invalid api key|failed to fetch/i.test(m) ? "Le site n'arrive pas à joindre Supabase : vérifie SUPABASE_URL et SUPABASE_ANON_KEY sur Vercel."
      : "Ça n'a pas marché. (Message de Supabase : " + m + ")";
  });
}

(async () => {
  $("#sync").textContent = "Chargement…";
  let cfg;
  try { cfg = await (await fetch("/api/config")).json(); } catch {}
  if (!cfg?.supabaseUrl || !window.supabase) { $("#sync").textContent = "Configuration manquante (voir LISEZ-MOI)"; render(); return; }
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const { data: { session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_IN" && !db) location.reload(); if (ev === "SIGNED_OUT") location.reload(); });
  if (!session) { $("#sync").textContent = ""; loginView(sb, cfg.appEmail); return; }
  const out = document.createElement("button");
  out.className = "iconbtn"; out.type = "button"; out.textContent = "Se déconnecter";
  out.onclick = () => sb.auth.signOut();
  $("#btn-settings").after(out);
  db = makeDb(sb, session.user.id);
  sample = makeSample(sb); canSendImages = true;
  let loaded = 0;
  for (const col of COLS) db.collection(col).onSnapshot(snap => {
    S[col] = snap.docs.map(x => ({ id: x.id, ...x.data() }));
    if (++loaded >= COLS.length) $("#sync").textContent = "";
    schedule();
  }, () => { $("#sync").textContent = "Connexion perdue, recharge la page"; });
  db.doc("config/reglages").onSnapshot(snap => { S.cfg = snap.exists ? { ...snap.data() } : {}; schedule(); }, () => {});
  render();
})();
setInterval(() => { if (tab === "jour" && !document.querySelector("dialog[open]")) render(); }, 5 * 60 * 1000);
})();
</script>
</body></html>
